name: Baysöz Labs ContractLattice CI — baysozlabs@proton.me

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PROJECT_OWNER: Baysöz Labs <baysozlabs@proton.me>

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Create environment and install project
        run: |
          uv venv
          uv pip install -e .
          uv pip install pytest ruff semgrep

      - name: Unit and adversarial tests
        run: uv run pytest -q

      - name: Static analysis and security scan
        run: |
          uv run ruff check --select E,F,W,S,B .
          uv run semgrep --config p/default --error .

      - name: Live CLI conformance check
        run: |
          uv run contractlattice --version
          uv run contractlattice tests/fixtures/base.yaml tests/fixtures/safe.yaml
          if uv run contractlattice tests/fixtures/base.yaml tests/fixtures/breaking.yaml; then
            echo "breaking fixture unexpectedly passed" >&2
            exit 1
          fi
